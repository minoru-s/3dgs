<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>3DGS Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0e; overflow: hidden; font-family: -apple-system, sans-serif; }
  #container { width: 100%; height: 100%; }
  #hint {
    position: fixed; top: 62px; left: 12px; color: #ddd; background: rgba(0,0,0,0.5);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; z-index: 10;
    pointer-events: none;
  }
  #level-controls {
    position: fixed; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px;
    color: #eee; background: rgba(0,0,0,0.68); padding: 8px 10px; border-radius: 9px;
    font-size: 13px; z-index: 12; backdrop-filter: blur(8px);
  }
  #level-controls select, #level-controls button {
    color: #f4f4f4; background: #252932; border: 1px solid #555d6b; border-radius: 6px;
    padding: 5px 8px; font: inherit;
  }
  #level-controls button { cursor: pointer; }
  #level-controls button:hover { background: #333a47; }
  #level-controls label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #file-input { display: none; }
  #load-status {
    position: fixed; top: 62px; right: 12px; max-width: min(520px, 70vw);
    color: #eef4ff; background: rgba(19, 50, 88, 0.9); padding: 8px 12px;
    border-radius: 8px; font-size: 13px; line-height: 1.5; z-index: 11; display: none;
  }
  #dropzone {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(30,120,255,0.15); border: 3px dashed rgba(120,170,255,0.8);
    color: #fff; font-size: 22px; z-index: 20; pointer-events: none;
  }
  #dropzone.active { display: flex; }
  #error {
    position: fixed; top: 12px; right: 12px; max-width: 40%; color: #fff;
    background: rgba(180,30,30,0.85); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; display: none; z-index: 10;
  }
</style>
</head>
<body>
  <div id="container"></div>
  <div id="level-controls">
    <label>上方向
      <select id="up-axis" aria-label="上方向">
        <option value="z+" selected>+Z（通常）</option>
        <option value="z-">−Z</option>
        <option value="y+">+Y</option>
        <option value="y-">−Y</option>
        <option value="x+">+X</option>
        <option value="x-">−X</option>
      </select>
    </label>
    <button id="level-button" type="button">水平に戻す</button>
    <label><input id="yaw-only" type="checkbox"> 水平だけに固定</label>
    <button id="open-file-button" type="button">ファイルを選ぶ</button>
    <input id="file-input" type="file" accept=".ply,.splat,.ksplat" />
  </div>
  <div id="hint">.ply / .splat / .ksplat をドラッグ&amp;ドロップ、または <code>?file=</code> で指定<br>左ドラッグ: 左右旋回・上下チルト / 右ドラッグ: パン / ホイール: ズーム / H: 地面基準に戻す</div>
  <div id="load-status" role="status" aria-live="polite"></div>
  <div id="dropzone">ファイルをドロップして読み込み</div>
  <div id="error"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import * as GaussianSplats3D from "gaussian-splats-3d";

    const container = document.getElementById("container");
    const dropzone = document.getElementById("dropzone");
    const errorBox = document.getElementById("error");
    const upAxisSelect = document.getElementById("up-axis");
    const levelButton = document.getElementById("level-button");
    const yawOnlyCheckbox = document.getElementById("yaw-only");
    const openFileButton = document.getElementById("open-file-button");
    const fileInput = document.getElementById("file-input");
    const loadStatus = document.getElementById("load-status");

    const FORMAT_BY_EXTENSION = {
      ply: GaussianSplats3D.SceneFormat.Ply,
      splat: GaussianSplats3D.SceneFormat.Splat,
      ksplat: GaussianSplats3D.SceneFormat.KSplat,
    };

    const UP_VECTORS = {
      "x+": [1, 0, 0], "x-": [-1, 0, 0],
      "y+": [0, 1, 0], "y-": [0, -1, 0],
      "z+": [0, 0, 1], "z-": [0, 0, -1],
    };

    function selectedUp() {
      return new THREE.Vector3(...UP_VECTORS[upAxisSelect.value]).normalize();
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      loadStatus.style.display = "none";
      console.error(msg);
    }

    function formatFromName(name) {
      const match = name.toLowerCase().match(/\.([^.?#]+)(?:[?#].*)?$/);
      return match ? FORMAT_BY_EXTENSION[match[1]] : undefined;
    }

    function setLoadStatus(message) {
      loadStatus.textContent = message;
      loadStatus.style.display = message ? "block" : "none";
    }

    if (location.protocol === "file:") {
      showError("file:// では動作しません。'python3 -m http.server' 等でローカルサーバ経由で開いてください。");
    }

    function createViewer() {
      return new GaussianSplats3D.Viewer({
        // gsplatのCOLMAP正規化後はZ+が上方向。従来のY-指定だと床が回転軸になる。
        cameraUp: selectedUp().toArray(),
        initialCameraPosition: [0, -3.2, 1.1],
        initialCameraLookAt: [0, 0, 0.45],
        rootElement: container,
        selfDrivenMode: true,
        useBuiltInControls: true,
        sharedMemoryForWorkers: false,
        // GitHub PagesではSharedArrayBuffer用のCOOP/COEPヘッダーを設定できない。
        // ライブラリ推奨どおり、共有メモリ無効時はGPU sortも無効にする。
        gpuAcceleratedSort: false,
      });
    }

    let viewer = createViewer();
    let sceneLoaded = false;

    function updatePolarLimits() {
      // Google Mapsの3D表示に近く、真上からほぼ水平までは動かせるが、
      // 床の下へ潜って上下が反転する角度には入れない。
      const nearHorizon = Math.PI / 2 - 0.03;
      const min = yawOnlyCheckbox.checked ? nearHorizon : 0.08;
      const max = nearHorizon;
      [viewer.perspectiveControls, viewer.orthographicControls].forEach((controls) => {
        if (!controls) return;
        controls.minPolarAngle = min;
        controls.maxPolarAngle = max;
      });
    }

    function levelCamera() {
      if (!viewer.camera || !viewer.controls) return;
      const up = selectedUp();
      const target = viewer.controls.target.clone();
      const offset = viewer.camera.position.clone().sub(target);
      const distance = Math.max(offset.length(), 0.1);

      // 現在の方角は保ち、高さ成分だけ除いて視線を床と平行にする。
      const horizontal = offset.clone().addScaledVector(up, -offset.dot(up));
      if (horizontal.lengthSq() < 1e-8) {
        horizontal.set(0, -1, 0);
        if (Math.abs(horizontal.dot(up)) > 0.9) horizontal.set(1, 0, 0);
        horizontal.addScaledVector(up, -horizontal.dot(up));
      }
      horizontal.normalize().multiplyScalar(distance);

      viewer.camera.up.copy(up);
      viewer.camera.position.copy(target).add(horizontal);
      viewer.camera.lookAt(target);
      updatePolarLimits();
      viewer.controls.target.copy(target);
      viewer.controls.update();
      viewer.forceRenderNextFrame();
    }

    levelButton.addEventListener("click", levelCamera);
    upAxisSelect.addEventListener("change", levelCamera);
    yawOnlyCheckbox.addEventListener("change", () => {
      updatePolarLimits();
      if (yawOnlyCheckbox.checked) levelCamera();
    });
    window.addEventListener("keydown", (event) => {
      if (event.code === "KeyH") levelCamera();
    });

    async function loadSplat(pathOrUrl, { format, label = "scene" } = {}) {
      errorBox.style.display = "none";
      setLoadStatus(`読み込み中: ${label}`);
      // 2回目以降(ドラッグ&ドロップ)は既存シーンを破棄してから作り直す。
      // 初回は生成直後のViewerをそのまま使う(dispose直後の再生成はWebGLコンテキスト
      // 競合でcanvasが消えることがあるため避ける)。
      if (sceneLoaded) {
        await viewer.dispose();
        viewer = createViewer();
      }
      sceneLoaded = true;
      const sceneOptions = {
        splatAlphaRemovalThreshold: 5,
        showLoadingUI: true,
      };
      if (format !== undefined) sceneOptions.format = format;

      try {
        await viewer.addSplatScene(pathOrUrl, sceneOptions);
        viewer.start();
        updatePolarLimits();
        levelCamera();
        setLoadStatus(`読み込み完了: ${label}`);
        window.setTimeout(() => setLoadStatus(""), 2500);
      } catch (e) {
        showError("読み込みに失敗しました: " + e);
      }
    }

    async function loadLocalFile(file) {
      if (!/\.(ply|splat|ksplat)$/i.test(file.name)) {
        showError("対応形式は .ply / .splat / .ksplat です: " + file.name);
        return;
      }
      const format = formatFromName(file.name);
      const url = URL.createObjectURL(file);
      const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
      try {
        await loadSplat(url, { format, label: `${file.name} (${sizeMB} MB)` });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    const params = new URLSearchParams(location.search);
    const file = params.get("file");
    if (file) {
      loadSplat(file, { format: formatFromName(file), label: file });
    } else {
      viewer.start();
    }

    openFileButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (file) loadLocalFile(file);
      fileInput.value = "";
    });

    // ドラッグ&ドロップ対応
    ["dragenter", "dragover"].forEach((evt) =>
      window.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add("active");
      })
    );
    ["dragleave", "drop"].forEach((evt) =>
      window.addEventListener(evt, (e) => {
        e.preventDefault();
        if (evt === "dragleave" && e.target !== document.documentElement) return;
        dropzone.classList.remove("active");
      })
    );
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      loadLocalFile(f);
    });
  </script>
</body>
</html>
